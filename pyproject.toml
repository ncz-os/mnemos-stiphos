[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemos-stiphos"
version = "0.2.0"
description = "STIPHOS (Στίφος, \"a marshaled host\") — the GRAEAE Hive Mind for the Mnemos namespace: fleet-wide agent coordination, a claim/triage job queue, and cost-tier dispatch. Beta — carved out of mnemos-core so its release cadence is decoupled from the stable core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MNEMOS Contributors" }]
dependencies = [
    "mnemos-core",
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "sse-starlette>=1.8.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
# MCP-SSE bridge (mcp_bridge.py) exposing Hive + MNEMOS tools. GRAEAE tools
# require an explicitly configured GRAEAE-enabled upstream service.
# Carries its own ASGI server (uvicorn) + starlette mount surface.
mcp = ["mcp>=1.0.0,<3.0.0", "httpx>=0.27.0", "uvicorn>=0.30.0", "starlette>=0.37.0"]
# Oracle 23ai backend (oracle_repository.py); thin mode default. Sqlite is the
# zero-dependency default repository, so oracledb is opt-in.
oracle = ["oracledb>=4.0.1"]
test = ["pytest", "pytest-asyncio", "httpx>=0.27.0"]

[project.urls]
Homepage = "https://gitlab.com/ncz-os/mnemos-stiphos"
Repository = "https://gitlab.com/ncz-os/mnemos-stiphos"

[tool.setuptools.packages.find]
where = ["."]
include = ["mnemos.hive_mind"]
namespaces = true

[tool.setuptools.package-data]
"mnemos.hive_mind" = ["*.sql", "*.html"]

[tool.setuptools.data-files]
"share/mnemos-stiphos/migrations/oracle" = ["migrations/oracle/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
