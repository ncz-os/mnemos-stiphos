name: Publish mnemos-stiphos image (ghcr.io)

# Publishes ghcr.io/<owner>/mnemos-stiphos (amd64 + arm64), built FROM
# mnemos-core. STIPHOS is a separate hive service, not part of the mnemos
# umbrella image.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      core_image:
        description: 'Base mnemos-core image ref to build FROM'
        required: false
        default: 'ghcr.io/ncz-os/mnemos-core:latest'

concurrency:
  group: release-stiphos-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  CORE_IMAGE: ${{ github.event.inputs.core_image || 'ghcr.io/ncz-os/mnemos-core:latest' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/mnemos-stiphos
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MNEMOS_CORE_IMAGE=${{ env.CORE_IMAGE }}
            MNEMOS_STIPHOS_REF=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mnemos-stiphos
          cache-to: type=gha,mode=max,scope=mnemos-stiphos
          provenance: true
          sbom: true
